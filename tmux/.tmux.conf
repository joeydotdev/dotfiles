# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g base-index 1           # windows start at 1
set -g pane-base-index 1      # panes start at 1
set -g renumber-windows on    # re-number windows after closing

set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on

set -sg escape-time 0         # no delay for escape key (important for vim)

# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Vim keybindings ───────────────────────────────────────────────────────────
set -g mode-keys vi
set -g status-keys vi

# copy mode like vim
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi h send -X cursor-left
bind -T copy-mode-vi j send -X cursor-down
bind -T copy-mode-vi k send -X cursor-up
bind -T copy-mode-vi l send -X cursor-right
bind -T copy-mode-vi / command-prompt -p "search down:" "send -X search-forward \"%%%\""
bind -T copy-mode-vi ? command-prompt -p "search up:" "send -X search-backward \"%%%\""

# ── Pane navigation (vim-style) ───────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Smart pane switching with awareness of vim splits (requires vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# ── Pane resizing (vim-style) ─────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Splits (open in current path) ─────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Window navigation ─────────────────────────────────────────────────────────
bind -r n next-window
bind -r p previous-window
bind Tab last-window

# ── Mouse support ─────────────────────────────────────────────────────────────
set -g mouse on

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa] "
set -g status-right "#[fg=#a6e3a1]#(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/.*/ [&]/')#[fg=#6c7086]  %Y-%m-%d  %H:%M "
set -g status-right-length 80

set -g window-status-format " #I:#{b:pane_current_path} "
set -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I:#{b:pane_current_path} "
set -g window-status-style "fg=#6c7086"

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "bg=#313244,fg=#cdd6f4"

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'     # community sensible defaults
set -g @plugin 'tmux-plugins/tmux-resurrect'    # persist sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save sessions
set -g @plugin 'christoomey/vim-tmux-navigator' # seamless vim/tmux pane nav

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
